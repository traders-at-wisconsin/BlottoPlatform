# Runs the data layer's test suite against the Firebase emulators on every push / PR.
name: data-layer-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          npm install -g firebase-tools
          python -m venv functions/venv
          functions/venv/bin/pip install -r requirements-dev.txt

      - name: Generated types are current
        run: functions/venv/bin/python scripts/gen_types.py --check

      - name: Test
        run: firebase emulators:exec --only auth,firestore "functions/venv/bin/pytest -q"

      - name: Seed simulation
        run: firebase emulators:exec --only firestore "functions/venv/bin/python scripts/seed.py --seed 1"
